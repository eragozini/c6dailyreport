name: C6 Daily Market Close

on:
  schedule:
    - cron: '17 19 * * 1-5'
      timezone: America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-market-close
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Testar cálculos e renderização
        run: python -m pytest -q

      - name: Gerar PDF
        id: build
        run: python build_single_page.py --skip-stale

      - name: Upload dos artefatos
        if: steps.build.outputs.should_send == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fechamento-${{ steps.build.outputs.report_date }}
          path: |
            out/*.pdf
            out/*.png
            out/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Enviar por email
        if: steps.build.outputs.should_send == 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO:   ${{ secrets.SMTP_TO }}
          SMTP_SECURITY: ${{ vars.SMTP_SECURITY || 'starttls' }}
        run: >-
          python send_email.py
          --pdf "${{ steps.build.outputs.pdf_path }}"
          --report-date "${{ steps.build.outputs.report_date }}"
